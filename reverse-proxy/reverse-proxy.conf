server {
    if ($host = www.slava-kvet.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = slava-kvet.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

  listen 80;
  listen [::]:80;
  server_name slava-kvet.com www.slava-kvet.com;
  # Redirect HTTP to HTTPS
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl;
  server_name slava-kvet.com www.slava-kvet.com;

  ssl_certificate /etc/letsencrypt/live/slava-kvet.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/slava-kvet.com/privkey.pem;

  # Standard SSL settings.
  ssl_session_timeout 1d;
  ssl_session_cache shared:SSL:10m;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
  ssl_prefer_server_ciphers on;

  error_page 404 /404.html;

  # Reverse Proxy to the frontend service.
  location / {
    proxy_pass http://localhost:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Proxy API requests to a backend service.
  location /api/ {
    proxy_pass http://localhost:3333;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location = /404.html {
    internal;
  }
  #root /usr/share/nginx/html;
  #index index.html;

  #include /etc/nginx/mime.types;

  #types {
  #  application/javascript mjs js;
  #}

  #gzip on;
  #gzip_vary on;
  #gzip_proxied any;
  #gzip_comp_level 6;
  #gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;
}